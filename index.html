<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ukreate</title>
<meta name="robots" content="noindex">
<!-- The published build opens on Get Started, where you choose creator or hotel.
     A redirect rather than a copy of that page: /join/ is the real door, it owns
     the side choice and the link across to signing in, and there should not be a
     second copy of it drifting out of step. Three ways over, because a static
     host cannot send a 301: the header for browsers that honour it, the script
     for the rest, and a plain link for anyone with neither. -->
<meta http-equiv="refresh" content="0; url=/join/">
<link rel="canonical" href="/join/">
<script>location.replace('/join/' + location.search + location.hash);</script>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#f4f1ea;color:#0d2026;
       font:400 15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  a{color:#0d2026}
</style>
</head>
<body>
  <p>Taking you to <a href="/join/">Get Started</a>.</p>
</body>
</html>
