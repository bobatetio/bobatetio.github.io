<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Sign in · Ukreate for hotels</title>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<meta name="robots" content="noindex,follow">
<link href="/favicon.ico" rel="icon">
<link href="/favicon.svg" rel="icon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/ukapp.css?v=340">
<link rel="stylesheet" href="/assets/css/ukdash.css?v=11">
<link rel="stylesheet" href="/assets/css/ukfront.css?v=53">
</head>
<body class="ukApp ukAuthPage" data-uklogin>
<a class="ukSkip" href="#main">Skip to content</a>

<div class="ukAuth ukAuth--solo">
  <header class="ukAuth_top">
    <a class="ukAuth_brand" href="/" aria-label="Ukreate home">
      <img class="ukLogo ukLogo--onDark" src="/assets/img/ukreate-logo-white.svg" alt="Ukreate" width="510" height="166">
      <img class="ukLogo ukLogo--onLight" src="/assets/img/ukreate-logo-ink.svg" alt="Ukreate" width="510" height="166">
    </a>
    <p class="ukAuth_cross" id="ukSwap">New to Ukreate? <a class="ukAuth_link" href="/join/">Create an account</a></p>
  </header>

  <main class="ukAuth_pane" id="main">
    <p class="ukSignedOut" id="ukOut" hidden>You are signed out. Sign back in whenever you are ready.</p>

    <div class="ukAuth_card">
      <p class="ukAuth_kick" id="ukSide">For hotels and travel brands</p>
      <section class="ukStart_ask">
        <h1 class="ukAuth_h" id="ukTitle">Welcome back.</h1>
        <p class="ukAuth_sub" id="ukLede">Pick up where you left off with your hosted stays and the content waiting for you.</p>

        <div id="ukGoogleWrap"></div>

        <form id="ukForm" novalidate>
          <label class="ukField"><span class="ukField_l">Work email</span>
            <input class="ukField_i" name="email" type="email" placeholder="you@yourproperty.com" autocomplete="email" required></label>

          <label class="ukField"><span class="ukField_l" id="ukPwLabel">Password</span><span class="ukAuth_pw"><input class="ukField_i" name="password" type="password" placeholder="enter your password" autocomplete="current-password" required><button class="ukAuth_reveal" type="button" data-reveal aria-label="Show password" aria-pressed="false"><span data-icon="eye"></span></button></span></label>

          <p class="ukAuth_reset ukOldOnly"><button class="ukAuth_link ukAuth_linkBtn" type="button" data-reset>Reset your password</button></p>

          <button class="ukBtn ukStart_go" type="submit" id="ukSubmit">Sign in</button>

          <div class="ukAuth_row ukOldOnly">
            <label class="ukAuth_check"><input type="checkbox" checked> Keep me signed in</label>
          </div>
        </form>

      </section>
    </div>

    <p class="ukAuth_foot">Make the content instead? <a class="ukAuth_link" href="/creator/login/">Creators sign in here.</a></p>
  </main>

</div>

<script src="/assets/js/ukicons.js?v=9" defer></script>
<script src="/assets/js/ukauthx.js?v=11" defer></script>
<script src="/assets/js/uklogin.js?v=23" defer></script>
</body>
</html>
