<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ukreate — philosophy emblem (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Marcellus&family=DM+Serif+Display:ital@0;1&family=Lato:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.homePhilosophy_video{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#0d2026;opacity:0;transform:scale(.88);transform-origin:50% 50%;transition:opacity .9s cubic-bezier(.22,.9,.35,1),transform .9s cubic-bezier(.22,.9,.35,1)}
.homePhilosophy_video.is-in{opacity:1;transform:scale(1)}
.homePhilosophy_videoInner{position:absolute;inset:0}
.homePhilosophy_videoInner iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.homePhilosophy_emblem{position:absolute;top:54.85vw;left:50%;transform:translate(-50%,-50%);width:min(61vw,735px);aspect-ratio:1/1;pointer-events:none;z-index:1}
.homePhilosophy_emblem img{width:100%;height:100%;display:block}
.philoVideoBox{display:none;position:absolute;right:auto;left:calc(367.5px - 45vw);top:58%;width:clamp(265px,24vw,320px);z-index:4;pointer-events:auto}
.philoPitch{font-family:'Lato',sans-serif;font-size:13.5px;line-height:1.62;color:rgba(255,255,255,.78);margin:0 0 14px;max-width:82%;text-align:left}
.philoCard{display:flex;align-items:stretch;gap:14px;padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 36px rgba(0,0,0,.4)}
.philoCard_text{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.philoCard_badge{align-self:flex-start;background:#fff;color:#0d2026;font-family:'Lato',sans-serif;font-size:10px;font-weight:700;letter-spacing:.02em;padding:4px 11px;border-radius:9999px}
.philoCard_title{font-family:'Lato',sans-serif;font-size:16px;font-weight:700;color:#e5d2a1;margin:11px 0 6px;line-height:1.2}
.philoCard_sub{font-family:'Lato',sans-serif;font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.62);margin:0}
.philoVideoBox .homePhilosophy_video{position:relative;inset:auto;flex-shrink:0;width:clamp(140px,13.5vw,168px);border-radius:14px;overflow:hidden;background:#0d2026;opacity:1;transform:none}
.philoVideoBox{right:-14.5vw}
.philoVideoBox{display:none}
.philoVideoBox .homePhilosophy_video{cursor:pointer}
.philoPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:9999px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-left:2px;background:rgba(255,255,255,.92);color:#0d2026;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .25s ease,background .25s ease}
.philoVideoBox .homePhilosophy_video:hover .philoPlay{transform:translate(-50%,-50%) scale(1.08);background:#fff}
.philoBigVideo.homePhilosophy_video{position:relative;inset:auto;width:clamp(340px,49vw,652px);margin:0 auto clamp(18px,2.1vw,32px);aspect-ratio:3/2;border-radius:20px;overflow:hidden;background:#0d2026;cursor:pointer;opacity:0;transform:none;transition:opacity 1s ease}
.philoBigVideo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(to bottom,rgba(13,32,38,0),#0d2026 82%);pointer-events:none;z-index:2}
.philoBigVideo .homePhilosophy_videoInner{transform:none}
.philoBigVideo.is-in.homePhilosophy_video{opacity:1}
.philoBigVideo.homePhilosophy_video{opacity:1;transform:none;transition:none}
.philoVideoBox{opacity:0;transform:translateY(60px);transition:opacity .9s ease,transform 1.8s cubic-bezier(.16,1,.3,1)}
.philoVideoBox.is-in{opacity:1;transform:translateY(0)}
.philoVideoBox{opacity:1;transform:none;transition:none}
.philoBigVideo .philoPlay{width:66px;height:66px;top:40%}
.philoBigVideo .philoPlay svg{width:30px;height:30px}
.philoBigVideo:hover .philoPlay{transform:translate(-50%,-50%) scale(1.08);background:#fff}

/* ---- globe + creator orbit (recovered) ---- */
.ukGlobe{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.ukGlobe canvas{filter:drop-shadow(0 0 60px rgba(101,210,233,.10))}
.ukOrbit{position:absolute;inset:0;z-index:1;pointer-events:none;--orbit-size:60px}
.ukOrbit_item{position:absolute;left:50%;top:50%;width:var(--orbit-size);height:var(--orbit-size);opacity:0;will-change:transform,opacity}
.ukOrbit_disc{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;opacity:0;transform:scale(.55);
  transition:opacity .8s cubic-bezier(.22,.61,.36,1),transform .8s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 0 0 1.5px rgba(230,182,76,.5),0 0 22px rgba(230,182,76,.16),0 10px 24px rgba(0,0,0,.45)}
.ukOrbit.is-in .ukOrbit_disc{opacity:1;transform:scale(1)}
.ukOrbit_disc img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
@media (prefers-reduced-motion:reduce){.ukOrbit_disc{transition:opacity .4s ease;transform:none}}
@media (max-width:900px){.ukOrbit{display:none}}
/* the demo page has no long scroll, so pin the emblem into view */
.demoStage{position:relative;min-height:100svh}
.demoStage .homePhilosophy_emblem{top:50%}
.demoStage .philoVideoBox{display:flex!important;flex-direction:column}
body{margin:0;background:#0d2026;color:#fff;font-family:'Lato','Inter',sans-serif}
.demoBar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:12px clamp(16px,4vw,32px);background:rgba(9,24,29,.72);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.10);font-size:13px;letter-spacing:.02em;color:rgba(255,255,255,.8)}
.demoBar strong{font-family:"Marcellus",serif;font-weight:400;font-size:16px;color:#efc470}

</style>
</head>
<body>
<div class="demoBar"><strong>Ukreate</strong> <span>Philosophy emblem — dotted globe, orbiting creators, and the Creator Revolution card. Standalone demo page.</span></div>
<section class="demoStage"><div class="homePhilosophy_emblem" aria-hidden="true"><div class="philoVideoBox"><p class="philoPitch">Go inside the creator economy and see how Ukreate connects hotels with the creators driving real bookings.</p><div class="philoCard"><div class="philoCard_text"><span class="philoCard_badge">Watch</span><h4 class="philoCard_title">The Creator Revolution</h4><p class="philoCard_sub">How Ukreate is<br>changing the game</p></div><div class="homePhilosophy_video" data-philo-video data-video-id="6vIXOuF0AFU"><div class="homePhilosophy_videoInner"></div></div></div></div><div id="ukGlobe" class="ukGlobe" aria-hidden="true"></div><div id="ukCreatorOrbit" class="ukOrbit" aria-hidden="true"></div></div></section>
<script src="/assets/js/vendor/three.min.js" defer></script>
<script src="/assets/js/globe-originkit.js?v=1785520000" defer></script>
<script src="/assets/js/creator-orbit.js?v=1785520000" defer></script>
<script src="/assets/js/philovideo.js?v=1785520000" defer></script>
</body>
</html>
